<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zyvora Pharmacy Workspace</title>
<meta name="description" content="A pharmacy counter and stock system for India: GST, batches and expiry, Schedule H/H1/X and the controlled-drug register.">
<style>
  :root { --bg:#fff; --text:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --text:#f5f5f7; --muted:#a1a1a6; --accent:#2997ff; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.47 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:760px; margin:0 auto; padding:14vh 24px 10vh; text-align:center; }
  h1 { font-size:clamp(36px,7vw,64px); line-height:1.07; letter-spacing:-0.02em; margin:0 0 16px; }
  p { color:var(--muted); font-size:21px; margin:0 auto 32px; max-width:34em; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:12px 24px; border-radius:980px; font-weight:600; }
  a.quiet { color:var(--accent); text-decoration:none; margin-left:20px; }
  small { display:block; margin-top:48px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>The pharmacy counter, done right.</h1>
  <p>Sell with GST, track every batch and expiry, and keep the controlled-drug register. On your desktop or on the web.</p>
  <a class="btn" href="demo/">Try the demo</a><a class="quiet" href="https://github.com/zyrona-labs/zyvora-site#readme">Read more</a>
  <small>The demo runs in your browser with made-up data. Never enter real patient or business data.</small>
</main>
</body>
</html>
